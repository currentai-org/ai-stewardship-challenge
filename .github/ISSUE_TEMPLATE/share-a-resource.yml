name: Share a resource
description: Point us to a paper, dataset, tool, or practice relevant to the challenge.
title: "[Resource] "
labels: ["resource"]
body:
  - type: input
    id: link
    attributes:
      label: Link
      description: URL to the paper, repo, dataset, post, or tool.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Paper or report
        - Dataset
        - Tool or project
        - Maintainer practice or policy
        - Other
    validations:
      required: true
  - type: checkboxes
    id: tracks
    attributes:
      label: Tracks
      description: Which tracks does it inform?
      options:
        - label: "A: Portable contributor trust"
        - label: "B: Onboarding ladder"
        - label: "C: Governance of agents"
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: One or two sentences on what it shows or how teams could use it.
    validations:
      required: true
